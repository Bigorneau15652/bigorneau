name: Publier une version

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verifier que l etiquette est le numero de version du manifeste
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "L etiquette ${GITHUB_REF_NAME} est differente de la version du manifeste ${VERSION}."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Joindre les fichiers a la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" main.js manifest.json styles.css --clobber
          else
            gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --title "${GITHUB_REF_NAME}" --notes "Version ${GITHUB_REF_NAME}"
          fi
