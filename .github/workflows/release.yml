name: Publier une version

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verifier que l etiquette est le numero de version du manifeste
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "L etiquette ${GITHUB_REF_NAME} est differente de la version du manifeste ${VERSION}."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Attester la provenance des fichiers
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Preparer les notes de version
        run: |
          awk -v v="${GITHUB_REF_NAME}" '$0 == "## " v {found=1; next} /^## / {found=0} found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then git log -1 --format=%s > release-notes.md; fi
      - name: Joindre les fichiers a la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" main.js manifest.json styles.css --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
