<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
:root {
  --text-normal: #dcddde; --text-muted: #999; --text-faint: #777; --text-on-accent: #fff; --text-error: #e5534b;
  --text-accent: #a68af9; --text-selection: #3a3a6a; --text-highlight-bg: #6b5b00;
  --background-primary: #1e1e1e; --background-secondary: #262626; --background-modifier-hover: #333;

body { margin: 0; background: var(--background-primary); color: var(--text-normal); font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 16px; }
